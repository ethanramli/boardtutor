name: Desktop previews

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preview:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macOS Apple silicon
            artifact: macOS-apple-silicon
            bundle: app
          - runner: macos-15-intel
            platform: macOS Intel
            artifact: macOS-intel
            bundle: app
          - runner: windows-2022
            platform: Windows x64
            artifact: Windows-x64
            bundle: nsis
          - runner: ubuntu-24.04
            platform: Linux x64
            artifact: Linux-x64-deb
            bundle: deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install Linux build and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth
      - run: npm ci
      - run: npm test
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }} -- --locked
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked
      - name: Check Linux desktop startup
        if: runner.os == 'Linux'
        run: |
          set +e
          WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a timeout 10s src-tauri/target/release/board-tutor
          status=$?
          set -e
          test "$status" -eq 124
      - name: Prepare macOS archive
        if: runner.os == 'macOS'
        run: |
          mkdir -p preview
          ditto "src-tauri/target/release/bundle/macos/Board Tutor.app" "preview/Board Tutor.app"
          ditto -c -k --keepParent "preview/Board Tutor.app" "Board-Tutor-${{ matrix.artifact }}.zip"
          mkdir -p downloads
          mv "Board-Tutor-${{ matrix.artifact }}.zip" downloads/
      - name: Prepare Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory downloads | Out-Null
          $installer = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe
          Copy-Item $installer.FullName downloads/Board-Tutor-Windows-x64-setup.exe
      - name: Check Windows installer creates the workspace before first launch
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $workspace = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'boardtutor'
          if (Test-Path -LiteralPath $workspace) { throw 'Workspace already exists before install' }
          $setup = Get-Item downloads/Board-Tutor-Windows-x64-setup.exe
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          foreach ($folder in 'memory', 'skills', 'whiteboards') {
            if (!(Test-Path -LiteralPath (Join-Path $workspace $folder) -PathType Container)) {
              throw "Installer did not create $folder"
            }
          }
      - name: Prepare Debian package
        if: runner.os == 'Linux'
        run: |
          mkdir downloads
          dpkg-deb -I src-tauri/target/release/bundle/deb/*.deb
          cp src-tauri/target/release/bundle/deb/*.deb downloads/Board-Tutor-Linux-x64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Board-Tutor-${{ matrix.artifact }}
          path: downloads/
          if-no-files-found: error

  release:
    name: Publish desktop installers
    if: github.ref_type == 'tag'
    needs: preview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Board-Tutor-*
          path: downloads
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            downloads/Board-Tutor-Windows-x64-setup.exe \
            downloads/Board-Tutor-macOS-apple-silicon.zip \
            downloads/Board-Tutor-macOS-intel.zip \
            downloads/Board-Tutor-Linux-x64.deb
