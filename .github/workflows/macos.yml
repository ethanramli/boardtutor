name: macOS preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run tauri -- build --bundles app -- --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Zip the app and setup script
        run: |
          mkdir -p preview
          ditto "src-tauri/target/release/bundle/macos/Excali Tutor.app" "preview/Excali Tutor.app"
          cp scripts/setup-mac.sh preview/
          ditto -c -k --keepParent preview "Excali-Tutor-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Excali-Tutor-macOS-${{ matrix.arch }}
          path: Excali-Tutor-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
